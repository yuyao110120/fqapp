name: macOS

# Builds the macOS desktop app on GitHub's arm64 macOS runners. The app is
# ad-hoc signed by scripts/build_macos.sh (no Developer ID secrets needed) and
# uploaded as an Actions artifact. See MACOS.md.

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'rust/**'
      - 'assets/**'
      - 'scripts/build_macos.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'rust/**'
      - 'assets/**'
      - 'scripts/build_macos.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 15's default Xcode 16.4 cannot compile connectivity_plus 7.3.1
    # (NWPath.isUltraConstrained needs the macOS 26 SDK), hence macos-26.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain
        run: |
          flutter --version
          rustc --version
          pod --version || true

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --release --lib

      - name: Build and package
        run: ./scripts/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqapp-macos-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
